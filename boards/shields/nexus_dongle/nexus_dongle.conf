# NEXUS dongle defaults. Anything here is overridable from the user's
# <shield>.conf or nexus.conf - none of it is baked into source.

CONFIG_NEXUS=y
CONFIG_NEXUS_DISPLAY=y
CONFIG_NEXUS_SPLASH=y
CONFIG_NEXUS_SOUND=y
CONFIG_NEXUS_GAME_CENTER=y
CONFIG_NEXUS_TETRIS=y
CONFIG_NEXUS_BUTTON=y


# Production logging posture (Section 65): USB logging costs power.
CONFIG_ZMK_USB_LOGGING=n

# No CONFIG_LOG_DEFAULT_LEVEL here: with logging off, CONFIG_LOG is n and the
# assignment cannot take, which Kconfig warns about and ZMK turns into a build
# failure. Turning logging on is what sets the level - see docs/development.md.
