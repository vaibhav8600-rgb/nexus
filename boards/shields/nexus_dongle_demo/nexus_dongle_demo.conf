CONFIG_ZMK_STUDIO=y

# Standalone bring-up: no halves to talk to, so do not wait on a split link.
CONFIG_ZMK_SPLIT=n

# This shield's zmk,kscan-mock pulls in Zephyr's KSCAN class, which is
# deprecated and warns - and ZMK builds warnings-as-errors. ZMK's own kscan
# drivers do not need the Zephyr class, so turning it off costs nothing. The
# author's Snake dongle config does exactly the same thing for the same reason.
CONFIG_KSCAN=n
