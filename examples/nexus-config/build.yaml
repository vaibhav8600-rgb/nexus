# One artifact per role, named so nobody flashes the wrong .uf2 (Section 82).
include:
  # The dongle: display, UI, games, sound, Studio over USB.
  - board: nice_nano_v2
    shield: nexus_dongle sofle_dongle
    snippet: studio-rpc-usb-uart
    artifact-name: nexus_dongle

  # The halves. Both are peripherals now that the dongle is central, and
  # neither compiles a single line of NEXUS (Section 81).
  - board: nice_nano_v2
    shield: sofle_left_peripheral
    artifact-name: sofle_left

  - board: nice_nano_v2
    shield: sofle_right
    artifact-name: sofle_right

  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset

  # Hardware bring-up build: no keyboard needed, boots straight to the UI.
  - board: nice_nano_v2
    shield: nexus_dongle nexus_dongle_demo
    snippet: studio-rpc-usb-uart
    artifact-name: nexus_standalone
