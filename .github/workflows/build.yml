name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable

    strategy:
      fail-fast: false
      matrix:
        include:
          # The standalone demo is what proves the module actually compiles and
          # links. Left/right halves come from the integrator's own keyboard
          # shield and are built in their config repo (see examples/).
          - name: nexus_dongle
            board: nice_nano@2.0.0//zmk
            shield: nexus_dongle nexus_dongle_demo
            snippet: studio-rpc-usb-uart
          - name: nexus_dongle_no_studio
            board: nice_nano@2.0.0//zmk
            shield: nexus_dongle nexus_dongle_demo
            snippet: ""
          # Section 81: a peripheral build must not drag in the UI, the games
          # or the display stack. If NEXUS ever leaks into this one, the size
          # check below fails.
          - name: settings_reset
            board: nice_nano@2.0.0//zmk
            shield: settings_reset
            snippet: ""

    steps:
      - uses: actions/checkout@v4
        with:
          path: nexus

      # Makes a pasted log self-identifying. Runs are per-commit, so when you
      # are iterating on CI it is easy to read the previous run's failure and
      # conclude a fix did not work.
      - name: Which commit is this
        run: |
          cd nexus
          echo "commit:  $(git rev-parse --short HEAD)"
          echo "subject: $(git log -1 --format=%s)"

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: zmk-${{ hashFiles('nexus/.github/ci/west.yml') }}
          restore-keys: zmk-

      # west takes topdir to be the PARENT of the manifest directory, so the
      # manifest has to live directly under the workspace root. Copying it out
      # of .github/ci is what keeps topdir at the runner workspace, which is
      # what the cache paths above and `-s zmk/app` below both assume.
      - name: Stage the west manifest
        run: |
          mkdir -p manifest
          cp nexus/.github/ci/west.yml manifest/west.yml

      - name: West init
        run: west init -l manifest

      - name: West update
        run: west update

      - name: West Zephyr export
        run: west zephyr-export

      # Zephyr 4.1 uses hardware model v2, where a board target is
      # <board>@<revision>/<soc>/<variant> and the old flat `nice_nano_v2`
      # no longer resolves. When that goes wrong the error dumps every board
      # Zephyr knows and none of the valid qualifiers, so print the matching
      # ones here: one CI round to find the answer instead of one per guess.
      - name: Show matching board targets
        run: |
          west boards --format '{name} qualifiers={qualifiers} revisions={revisions}' \
            2>/dev/null | grep -iE 'nice_nano|promicro' \
            || west boards 2>/dev/null | grep -iE 'nice_nano|promicro' \
            || true

      # Plain POSIX sh: this container runs `sh -e {0}`, not bash, so no
      # `set -o pipefail` and no `tee` into a pipeline.
      #
      # A failing Zephyr build prints ~800 progress lines before the actual
      # diagnostic, which pushes it past the truncation limit of every log
      # viewer. So capture everything to a file and, on failure, print only
      # the lines that matter - short enough to read and to paste.
      - name: Build ${{ matrix.name }}
        run: |
          if west build -s zmk/app -b ${{ matrix.board }} \
               ${{ matrix.snippet && format('-S {0}', matrix.snippet) || '' }} \
               -- -DSHIELD="${{ matrix.shield }}" \
                  -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/nexus" \
               > build-output.log 2>&1; then
            tail -n 15 build-output.log
            exit 0
          fi

          echo "=================== DIAGNOSTICS ==================="
          grep -nE "error:|FAILED:|undefined reference|No such file" \
            build-output.log | head -n 60
          echo "=================== LAST 40 LINES ================="
          tail -n 40 build-output.log

          {
            echo "### ${{ matrix.name }} failed"
            echo '```'
            grep -nE "error:|FAILED:|undefined reference" build-output.log |
              head -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload full build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-build-log
          path: build-output.log
          if-no-files-found: warn

      - name: Report flash and RAM
        # Section 100: the memory budget is a build-time concern, not a
        # surprise at flash time. This line is the number to watch when adding
        # artwork or fonts.
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 12 build/build.log 2>/dev/null || true
          arm-zephyr-eabi-size build/zephyr/zmk.elf | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          # Section 82: artifacts are named for what they are, so nobody flashes
          # the wrong .uf2 to the wrong half.
          path: |
            build/zephyr/zmk.uf2
            build/zephyr/zmk.hex
          if-no-files-found: error

  devicetree:
    # Section 84: catch overlay and binding mistakes without a full firmware
    # link, and much faster than the matrix above.
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexus

      - name: Every YAML binding parses
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import yaml

          bad = 0
          for path in glob.glob("nexus/dts/bindings/**/*.yaml", recursive=True):
              try:
                  doc = yaml.safe_load(open(path, encoding="utf-8"))
              except Exception as exc:
                  print("::error file=%s::%s" % (path, exc))
                  bad += 1
                  continue
              if "compatible" not in doc:
                  print("::error file=%s::binding has no compatible" % path)
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: Shield metadata parses
        run: |
          python3 -c "
          import glob, yaml
          for p in glob.glob('nexus/boards/shields/*/*.zmk.yml'):
              d = yaml.safe_load(open(p))
              assert d['id'] and d['type'] == 'shield', p
              print('ok', p)
          "
